<style>

.matchwrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tag.done{background:#e7f7ef;color:var(--ok)}

.unitnav{display:flex;justify-content:space-between;margin-top:26px;gap:10px}

<header class="top"><div class="topbar">
  <div class="brand">S3.2 COURSE<small>IB Chemistry · Unit 4</small></div>

</div></header>
<div id="annoBar">
  <span style="font-size:12px;color:#cfe0f2">Annotate mode</span>
  <span class="pc on" data-c="#C0392B" style="background:#C0392B"></span>
  <span class="pc" data-c="#1F6FB2" style="background:#1F6FB2"></span>
  <span class="pc" data-c="#1e8e5a" style="background:#1e8e5a"></span>
  <span class="pc" data-c="hl" style="background:linear-gradient(90deg,#ffe066,#ffd43b)"></span>
  <button class="ab" id="annoEraser">Eraser</button>
  <button class="ab" id="annoPause">Pause</button>

  Syllabus references: IB Chemistry Guide (first assessment 2025). Your progress is saved only in this browser.

<script>
"use strict";
/* ---------------- state ---------------- */
const KEY = "u4s32course";
let S = JSON.parse(localStorage.getItem(KEY) || "{}");
// migrate old TYU ratings (plain strings) to objects {rating, pad}
if (S.tyu) for (const k of Object.keys(S.tyu)){
  if (typeof S.tyu[k] === "string") S.tyu[k] = { rating: S.tyu[k] };
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function resetAll(){ if(confirm("Erase all progress on this device?")){ S = {}; save(); route("home"); } }

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const norm = s => String(s).toLowerCase().replace(/[\s\-.()]/g,"");

/* ---------------- sketch pads — Apple Pencil ready ---------------- */
const DPR = Math.min(2, (typeof window!=="undefined" && window.devicePixelRatio) || 1);
let penSeen = false; // once a real pencil touches, ignore finger input (palm rejection)

function buildPad(mount, opts){
  // opts: {get:()=>dataURL|null, set:(dataURL|null)=>void, small:bool}
  mount.innerHTML = `
   <div class="pad${opts.small ? " small" : ""}">
     <div class="padtools">
       <span class="pc on" data-c="#0E2A47" style="background:#0E2A47"></span>
       <span class="pc" data-c="#C0392B" style="background:#C0392B"></span>
       <span class="pc" data-c="#1F6FB2" style="background:#1F6FB2"></span>
       <button class="pw on" data-w="2">thin</button>
       <button class="pw" data-w="4">med</button>
       <button class="pw" data-w="7">thick</button>
       <button class="pe">eraser</button>
       <button class="pcx">clear</button>
       <span class="hint" style="margin-left:auto">Apple Pencil: pressure + palm rejection</span>
     </div>
     <canvas></canvas>
   </div>`;
  const canvas = mount.querySelector("canvas");
  if (!canvas || typeof canvas.getContext !== "function") return; // no-DOM test guard
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  const tools = mount.querySelector(".padtools");
  let color = "#0E2A47", width = 3, eraser = false, saveTimer = null;
  function redrawSaved(){
    const d = opts.get && opts.get();
    if (!d) return;
    const im = new Image();
    im.onload = ()=>ctx.drawImage(im, 0, 0, canvas.width, canvas.height);
    im.src = d;
  }
  function size(){
    const w = canvas.clientWidth || 600, h = canvas.clientHeight || (opts.small?220:300);
    let keep = null;
    if (canvas.width > 0 && canvas._hasStrokes){
      keep = document.createElement("canvas");
      keep.width = canvas.width; keep.height = canvas.height;
      keep.getContext("2d").drawImage(canvas, 0, 0);
    }
    canvas.width = Math.round(w * DPR); canvas.height = Math.round(h * DPR);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    canvas._hasStrokes = false;
    if (keep){ ctx.drawImage(keep, 0, 0, canvas.width, canvas.height); canvas._hasStrokes = true; }
    else redrawSaved();
  }
  canvas._padSize = size;
  size();
  function pt(e){
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * DPR, y: (e.clientY - r.top) * DPR, p: e.pressure || 0.5 };
  }
  function style(p){
    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = eraser ? "#ffffff" : color;
    const k = (p.p > 0 && p.p < 1) ? 0.45 + 1.1 * p.p : 1; // pencil pressure
    ctx.lineWidth = width * DPR * (eraser ? 2.4 : 1) * k;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
  }
  function stroke(a, b){
    style(a);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    canvas._hasStrokes = true;
  }
  let drawing = false, last = null;
  canvas.addEventListener("pointerdown", e=>{
    if (penSeen && e.pointerType === "touch") return;
    if (e.pointerType === "pen") penSeen = true;
    drawing = true;
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
    last = pt(e);
    stroke(last, { x: last.x + 0.1, y: last.y, p: last.p });
  });
  canvas.addEventListener("pointermove", e=>{
    if (!drawing) return;
    const p = pt(e); stroke(last, p); last = p;
  });
  const stop = ()=>{ if (drawing){ drawing = false; scheduleSave(); } };
  canvas.addEventListener("pointerup", stop);
  canvas.addEventListener("pointercancel", stop);
  function scheduleSave(){
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      try{
        const d = canvas.toDataURL("image/jpeg", 0.72);
        if (opts.set) opts.set(d);
        save();
      }catch(err){ /* storage full — drawing stays in memory */ }
    }, 700);
  }
  tools.addEventListener("click", e=>{
    const t = e.target.closest("button, .pc");
    if (!t) return;
    if (t.classList.contains("pc")){
      tools.querySelectorAll(".pc").forEach(x=>x.classList.remove("on"));
      t.classList.add("on");
      color = t.dataset.c; eraser = false;
      const pe = tools.querySelector(".pe"); if (pe) pe.classList.remove("on");
    } else if (t.classList.contains("pw")){
      tools.querySelectorAll(".pw").forEach(x=>x.classList.remove("on"));
      t.classList.add("on"); width = +t.dataset.w;
    } else if (t.classList.contains("pe")){
      eraser = !eraser; t.classList.toggle("on", eraser);
    } else if (t.classList.contains("pcx")){
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      canvas._hasStrokes = false;
      if (opts.set) opts.set(null);
      save();
    }
  });
}
function sizePads(root){
  (root || document).querySelectorAll("canvas").forEach(c=>{ if (c._padSize) c._padSize(); });
}
if (typeof window !== "undefined" && window.addEventListener)
  window.addEventListener("resize", ()=>sizePads(document));

/* ---------------- teacher annotate overlay (draw over the whole page) ---------------- */
function makeAnno(){
  const byId = id => (document.getElementById ? document.getElementById(id) : document.querySelector("#" + id));
  let btn = null, bar = null, cv = null;
  try{
    btn = byId("annoToggle"); bar = byId("annoBar"); cv = byId("annoCanvas");
  }catch(e){}
  if (!btn || !bar || !cv || typeof cv.getContext !== "function")
    return { toggle(){}, saveCur(){}, restore(){} };
  const ctx = cv.getContext("2d");
  if (!ctx) return { toggle(){}, saveCur(){}, restore(){} };
  let on = false, paused = false, color = "#C0392B", hl = false, width = 3, eraser = false;
  let drawing = false, last = null, dirty = false;
  function size(){
    let keep = null;
    if (cv.width > 0 && cv._hasStrokes){
      keep = document.createElement("canvas");
      keep.width = cv.width; keep.height = cv.height;
      keep.getContext("2d").drawImage(cv, 0, 0);
    }
    cv.width = window.innerWidth; cv.height = window.innerHeight;
    cv._hasStrokes = false;
    if (keep){ ctx.drawImage(keep, 0, 0); cv._hasStrokes = true; }
  }
  function pt(e){ return { x: e.clientX, y: e.clientY, p: e.pressure || 0.5 }; }
  function stroke(a, b){
    ctx.globalCompositeOperation = eraser ? "destination-out" : "source-over";
    ctx.globalAlpha = (hl && !eraser) ? 0.4 : 1;
    ctx.strokeStyle = color;
    const k = (a.p > 0 && a.p < 1) ? 0.45 + 1.1 * a.p : 1;
    ctx.lineWidth = width * (hl ? 4 : 1) * (eraser ? 2.5 : 1) * k;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.globalAlpha = 1;
    cv._hasStrokes = true; dirty = true;
  }
  cv.addEventListener("pointerdown", e=>{
    if (paused || !on) return;
    if (penSeen && e.pointerType === "touch") return;
    if (e.pointerType === "pen") penSeen = true;
    drawing = true;
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    last = pt(e);
    stroke(last, { x: last.x + 0.1, y: last.y, p: last.p });
  });
  cv.addEventListener("pointermove", e=>{
    if (!drawing || paused) return;
    const p = pt(e); stroke(last, p); last = p;
  });
  const up = ()=>{ if (drawing){ drawing = false; saveCur(); } };
  cv.addEventListener("pointerup", up);
  cv.addEventListener("pointercancel", up);
  function saveCur(){
    if (!cv._hasStrokes || !dirty) return;
    try{ S.anno = S.anno || {}; S.anno[routeNow] = cv.toDataURL("image/png"); save(); }
    catch(e){ /* quota — stays in memory */ }
    dirty = false;
  }
  function clearAll(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    cv._hasStrokes = false;
    if (S.anno){ delete S.anno[routeNow]; save(); }
  }
  function restore(v){
    ctx.clearRect(0, 0, cv.width, cv.height);
    cv._hasStrokes = false;
    if (!on) return;
    const d = S.anno && S.anno[v];
    if (!d) return;
    const im = new Image();
    im.onload = ()=>{ ctx.drawImage(im, 0, 0); cv._hasStrokes = true; };
    im.src = d;
  }
  function setPause(p){
    paused = p;
    cv.style.pointerEvents = p ? "none" : "auto";
    const b = bar.querySelector("#annoPause");
    if (b) b.textContent = p ? "Resume" : "Pause";
  }
  function toggle(){
    on = !on;
    btn.classList.toggle("on", on);
    bar.classList.toggle("on", on);
    cv.classList.toggle("on", on);
    if (on){ size(); restore(routeNow); setPause(false); }
    else { saveCur(); }
  }
  btn.onclick = toggle;
  bar.addEventListener("click", e=>{
    const t = e.target;
    if (!t || !t.classList) return;
    if (t.classList.contains("pc")){
      bar.querySelectorAll(".pc").forEach(x=>x.classList.remove("on"));
      t.classList.add("on");
      const c = t.dataset.c;
      hl = (c === "hl");
      color = hl ? "#f5c518" : c;
      eraser = false;
      const er = bar.querySelector("#annoEraser"); if (er) er.classList.remove("on");
    } else if (t.id === "annoEraser"){
      eraser = !eraser; t.classList.toggle("on", eraser);
    } else if (t.id === "annoPause"){
      setPause(!paused);
    } else if (t.id === "annoClear"){
      clearAll();
    } else if (t.id === "annoExit"){
      if (on) toggle();
    }
  });
  if (window.addEventListener)
    window.addEventListener("resize", ()=>{ if (on || cv._hasStrokes) size(); });
  return { toggle, saveCur, restore };
}
const Anno = makeAnno();

/* ================= DATA ================= */
const MODULES = [
/* ============ 4.1 ============ */
{ part:"4.1", title:"Key Concepts & Hydrocarbons", level:"SL", codes:"S3.2.1 – S3.2.6",
  read:"Coursebook §11.1–11.4 · pp.254–282",

  { t:"B · Functional groups & homologous series", blocks:[
    { type:"fill", text:"A homologous series is a family of compounds with the same [[functional group]], whose successive members differ by a common structural unit, usually [[CH2|-CH2-|CH₂]]." },
    { type:"fill", text:"A hydrocarbon contains only [[carbon]] and [[hydrogen]]. A functional group gives a molecule its characteristic [[chemical]] properties and also influences its [[physical]] properties." },

    { type:"reveal", q:"List the three defining features of a homologous series.",
      a:"① a general molecular formula (e.g. CₙH₂ₙ₊₂ for alkanes); ② the same functional group → similar chemical properties; ③ a gradation in physical properties as the chain lengthens." },

    { type:"reveal", q:"Ethanol (M<sub>r</sub> 46), ethanal (M<sub>r</sub> 44) and propane (M<sub>r</sub> 44) — rank by boiling point and justify.",
      a:"ethanol (78 °C) &gt; ethanal (21 °C) &gt; propane (−42 °C). Ethanol: London + dipole–dipole + <b>hydrogen bonding</b>; ethanal: London + dipole–dipole (polar C=O); propane: London only (non-polar). Relative molecular mass alone compares within a series, not between series." },

  { t:"C · IUPAC naming — the seven steps", blocks:[

    { type:"fill", text:"Tie-break: if both directions give the same numbers, the substituent that comes first [[alphabetically]] gets the lower number — ignoring the prefixes di- and tri- when alphabetising. Commas separate [[numbers|digits]]; dashes separate a number from [[letters|a letter|words]]." },

    { type:"reveal", q:"Naming alkenes and alkynes — where does the number go, and who wins between C=C and a substituent?",
      a:"Pattern alk-<i>x</i>-ene / alk-<i>x</i>-yne; <i>x</i> is the lower-numbered carbon of the multiple bond. A functional group written at the END of a name (−ene) always has priority for numbering over a substituent at the beginning (methyl, chloro…): e.g. 4-methylpent-2-ene, not 2-methylpent-3-ene." }
  ]},
  { t:"D · Structural isomers", blocks:[

const app = $("#app"), tabs = $("#tabs");
const VIEWS = ["home","4.1","4.2","4.3","4.4","4.5","report"];
let routeNow = "home";

function route(v){
  Anno.saveCur();
  routeNow = v;
  [...tabs.children].forEach(b => b.classList.toggle("on", b.dataset.v === v));
  window.scrollTo(0,0);
  if (v === "home") renderHome();
  else if (v === "report") renderReport();
  else renderModule(MODULES.findIndex(m => m.part === v));
  Anno.restore(v);
}

function buildTabs(){
  tabs.innerHTML = "";
  [["home","Home"],...MODULES.map(m=>[m.part,m.part]),["report","Report"]].forEach(([v,lab])=>{
    const b = document.createElement("button");
    b.textContent = lab; b.dataset.v = v; b.onclick = ()=>route(v);
    tabs.appendChild(b);
  });
}

/* ---------- block progress keys ---------- */
function bkey(mi, si, bi){ return `m${mi}s${si}b${bi}`; }

/* ---------- progress computation ---------- */
function blockStat(mi, si, bi, blk){
  const k = bkey(mi,si,bi);
  switch(blk.type){
    case "fill": {
      const arr = S.fills?.[k]; if(!arr) return {u:1,c:0};
      return {u:1, c: arr.every(Boolean)?1:0};
    }
    case "reveal": return {u:1, c: S.reveals?.[k]?1:0};
    case "table": {
      const arr = S.cells?.[k]; if(!arr || !arr.length) return {u:1,c:0};
      return {u:1, c: arr.every(Boolean)?1:0};
    }
    case "match": return {u:1, c: S.match?.[k]?.done?1:0};
    case "we": return {u:1, c: S.we?.[blk.n]?.attempted?1:0};
    case "tyu": return {u:1, c: (S.tyu?.[blk.img]?.rating)?1:0};
    case "quiz": {
      const arr = S.quiz?.[k] || [];
      const u = blk.questions.length, c = arr.filter(x=>x!=null).length;
      return {u,c};
    }
    default: return {u:0,c:0};
  }
}
function moduleProgress(mi){
  let u=0,c=0;
  MODULES[mi].sections.forEach((s,si)=>s.blocks.forEach((b,bi)=>{
    const st = blockStat(mi,si,bi,b); u+=st.u; c+=st.c;
  }));
  return {u,c,pct: u? Math.round(c/u*100):0};
}
function overall(){
  let u=0,c=0;
  MODULES.forEach((_,mi)=>{ const st=moduleProgress(mi); u+=st.u; c+=st.c; });
  return {u,c,pct: u? Math.round(c/u*100):0};
}

/* ---------- block renderers ---------- */
function renderBlock(mi,si,bi,blk){
  const card = document.createElement("div"); card.className = "card";
  const k = bkey(mi,si,bi);
  if (blk.type === "fill") renderFill(card, k, blk);
  else if (blk.type === "reveal") renderReveal(card, k, blk);
  else if (blk.type === "table") renderTable(card, k, blk);
  else if (blk.type === "match") renderMatch(card, k, blk);
  else if (blk.type === "we") renderWE(card, blk);
  else if (blk.type === "tyu") renderTYU(card, k, blk);
  else if (blk.type === "quiz") renderQuiz(card, k, blk);
  else if (blk.type === "img") card.innerHTML = `<div class="imgwrap"><img loading="lazy" src="img/${blk.img}.jpg"><div class="figcap">${esc(blk.cap||"")}</div></div>`;
  return card;
}

function renderFill(card, k, blk){
  const parts = blk.text.split(/\[\[(.+?)\]\]/g);
  const html = [];
  const answers = [];
  for (let i=0;i<parts.length;i++){
    if (i%2===0) html.push(esc(parts[i]));
    else { answers.push(parts[i].split("|").map(norm)); html.push(`<input data-i="${answers.length-1}" autocomplete="off" spellcheck="false">`); }
  }
  const saved = S.fills?.[k];
  const savedText = S.fillText?.[k];
  card.innerHTML = `<div class="fill">${html.join("")}</div>
    <div style="margin-top:8px">
      <button class="btn small">Check</button>
      <button class="btn ghost small">Show answers</button>
      <span class="hint" style="margin-left:8px">Type your answers, then check. Case and spacing are ignored.</span>
    </div>`;
  const inputs = [...card.querySelectorAll("input")];
  const [chk, show] = card.querySelectorAll("button");
  const toks = blk.text.match(/\[\[(.+?)\]\]/g).map(t=>t.slice(2,-2).split("|")[0]);
  function paint(){
    inputs.forEach((inp,i)=>{
      inp.classList.remove("ok","no");
      if (saved && saved[i]===true) inp.classList.add("ok");
      else if (saved && saved[i]===false) inp.classList.add("no");
    });
  }
  if (savedText) inputs.forEach((inp,i)=>{ if(savedText[i]) inp.value = savedText[i]; });
  inputs.forEach(inp=>inp.addEventListener("input",()=>{
    const arr = S.fills ||= {}; arr[k] ||= new Array(inputs.length).fill(null);
    const tArr = S.fillText ||= {}; tArr[k] ||= new Array(inputs.length).fill("");
    arr[k][+inp.dataset.i] = null;
    tArr[k][+inp.dataset.i] = inp.value;
    save(); inp.classList.remove("ok","no");
  }));
  chk.onclick = ()=>{
    const arr = S.fills ||= {}; arr[k] ||= new Array(inputs.length).fill(null);
    inputs.forEach((inp,i)=>{
      const ok = answers[i].includes(norm(inp.value));
      inp.classList.toggle("ok", ok); inp.classList.toggle("no", !ok);
      arr[k][i] = ok;
    });
    save();
  };
  show.onclick = ()=>{
    inputs.forEach((inp,i)=>{ inp.value = toks[i]; inp.classList.add("ok"); });
    const arr = S.fills ||= {}; arr[k] = inputs.map(()=>true); save();
  };
  if (saved){ paint(); }
}

function renderReveal(card, k, blk){
  card.innerHTML = `<div class="revealbox"><div class="q">${blk.q}</div>
    <div class="ans">${blk.a}</div>
    <button class="btn small" style="margin-top:8px">Think first, then reveal</button></div>`;
  const btn = card.querySelector("button"), ans = card.querySelector(".ans");
  if (S.reveals?.[k]){ ans.classList.add("show"); btn.textContent = "Hide again"; }
  btn.onclick = ()=>{
    const on = ans.classList.toggle("show");
    btn.textContent = on ? "Hide again" : "Think first, then reveal";
    if (on){ S.reveals ||= {}; S.reveals[k] = true; save(); }
  };
}

function renderTable(card, k, blk){
  const rIdx = blk.rows.map(r=>r.map((c,ci)=>({hidden: /^hide/.test(String(c))|| c===null })));
  // rows already contain answers; hide nothing explicitly — hide column? Simpler: last column(s) hidden
  // We hide every cell marked with object or the "answer" columns defined by hideCols
  const hideCols = blk.hideCols || blk.rows[0].map((_,ci)=>ci).filter(ci=>ci>0);
  let cellState = S.cells?.[k];
  if(!cellState){ cellState = blk.rows.map(()=>false); }
  const rowsHtml = blk.rows.map((r,ri)=>"<tr>"+r.map((c,ci)=>{
    if (hideCols.includes(ci)){
      const shown = cellState[ri];
      return `<td class="cellr${shown?" shown":""}" data-r="${ri}" data-ci="${ci}">${shown? esc(String(c)) : "· · tap ·"}</td>`;
    }
    return `<td>${esc(String(c))}</td>`;
  }).join("")+"</tr>").join("");
  card.innerHTML = `<table class="info"><tr>${blk.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${rowsHtml}</table>
    <button class="btn ghost small">Reveal all</button>`;
  function revealCell(td){
    const r = +td.dataset.r, ci = +td.dataset.ci;
    td.textContent = blk.rows[r][ci];
    td.classList.add("shown");
    cellState[r] = true;
    S.cells ||= {}; S.cells[k] = cellState; save();
  }
  card.querySelectorAll("td.cellr").forEach(td=>{ td.onclick = ()=>revealCell(td); });
  card.querySelector("button").onclick = ()=>{
    card.querySelectorAll("td.cellr").forEach(td=>revealCell(td));
  };
}

function renderMatch(card, k, blk){
  const right = blk.pairs.map(p=>p[1]);
  // shuffle right column (stable per session)
  let shuf = [...right].sort(()=>Math.random()-0.5);
  card.innerHTML = `<b>${blk.t}</b>
    <p class="hint">Tap an item on the left, then its partner on the right. (Also works by tapping right first.)</p>
    <div class="matchwrap">
      <div>${blk.pairs.map((p,i)=>`<div class="mitem" data-l="${i}">${esc(p[0])}</div>`).join("")}</div>
      <div>${shuf.map(v=>`<div class="mitem" data-r="${esc(v)}">${esc(v)}</div>`).join("")}</div>
    </div>
    <div style="margin-top:8px"><span class="hint" id="mstat"></span> <button class="btn ghost small">Restart game</button></div>`;
  let selL = null, selR = null, doneCount = 0;
  const stat = card.querySelector("#mstat");
  function refresh(){
    doneCount = blk.pairs.filter((p,i)=>card.querySelector(`.mitem[data-l="${i}"]`)?.classList.contains("done")).length;
    stat.textContent = `${doneCount}/${blk.pairs.length} matched`;
    if (doneCount === blk.pairs.length){
      stat.textContent = "All matched — well done.";
      S.match ||= {}; S.match[k] = {done:true}; save();
    }
  }
  function tryPair(){
    if (selL && selR){
      const li = +selL.dataset.l;
      if (blk.pairs[li][1] === selR.dataset.r){
        selL.classList.add("done"); selR.classList.add("done");
        selL.onclick = null; selR.onclick = null;
      } else {
        const l = selL, r = selR;
        l.classList.add("err"); r.classList.add("err");
        setTimeout(()=>{ l.classList.remove("err","sel"); r.classList.remove("err","sel"); }, 500);
      }
      selL = null; selR = null;
      setTimeout(()=>{ card.querySelectorAll(".mitem.sel").forEach(x=>x.classList.remove("sel")); }, 400);
      refresh();
    }
  }
  card.querySelectorAll(".mitem").forEach(item=>{
    item.onclick = ()=>{
      if (item.classList.contains("done")) return;
      item.classList.remove("err");
      if (item.dataset.l !== undefined){
        card.querySelectorAll("[data-l]").forEach(x=>x.classList.remove("sel"));
        selL = item; item.classList.add("sel");
      } else {
        card.querySelectorAll("[data-r]").forEach(x=>x.classList.remove("sel"));
        selR = item; item.classList.add("sel");
      }
      tryPair();
    };
  });
  card.querySelector("button").onclick = ()=>{ renderMatchInto(card, k, blk); };
  refresh();
}
function renderMatchInto(card, k, blk){ // re-render in place
  const fresh = document.createElement("div");
  renderMatch(fresh, k, blk);
  card.replaceWith(fresh);
}

function renderWE(card, blk){
  const n = blk.label || blk.n;
  const st = S.we?.[blk.n] || {};
  const showDraw = st.pad && !st.text;
  card.innerHTML = `
    <h3>Worked Example ${n} <span class="hint">· Coursebook p.${blk.p}</span></h3>
    <div class="imgwrap"><img loading="lazy" src="img/WE${blk.n.replace("11.","11_")}.jpg"></div>
    <div class="wtabs">
      <button class="wtab ${showDraw?"":"on"}" data-t="type">&#9000; Type</button>
      <button class="wtab ${showDraw?"on":""}" data-t="draw">&#9999; Sketch (Apple Pencil)</button>
    </div>
    <div class="wtype" ${showDraw?'style="display:none"':""}>
      <textarea placeholder="Your attempt — commit to an answer before looking at the textbook solution (autosaved)">${esc(st.text||"")}</textarea>
    </div>
    <div class="wdraw" ${showDraw?"":'style="display:none"'}></div>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn small wemark ${st.attempted?"gold":""}">${st.attempted?"Attempted ✓":"Mark as attempted"}</button>
      <button class="btn ghost small wesol">${st.revealed?"Hide textbook solution":"Show textbook solution"}</button>
    </div>
    <div class="imgwrap" style="display:none"><img loading="lazy" src="img/ANS${blk.n.replace("11.","11_")}.jpg"></div>`;
  buildPad(card.querySelector(".wdraw"), {
    get: ()=> (S.we && S.we[blk.n] && S.we[blk.n].pad) || null,
    set: d => { S.we = S.we || {}; S.we[blk.n] = S.we[blk.n] || {};
                if (d) S.we[blk.n].pad = d; else delete S.we[blk.n].pad; }
  });
  const typePane = card.querySelector(".wtype");
  const drawPane = card.querySelector(".wdraw");
  card.querySelectorAll(".wtab").forEach(tab=>{
    tab.onclick = ()=>{
      card.querySelectorAll(".wtab").forEach(x=>x.classList.remove("on"));
      tab.classList.add("on");
      const isDraw = tab.dataset.t === "draw";
      typePane.style.display = isDraw ? "none" : "";
      drawPane.style.display = isDraw ? "" : "none";
      if (isDraw) sizePads(card);
    };
  });
  const mark = card.querySelector(".wemark");
  const sol = card.querySelector(".wesol");
  const solImg = card.querySelectorAll(".imgwrap")[1];
  const ta = card.querySelector("textarea");
  if (st.revealed) solImg.style.display = "";
  mark.onclick = ()=>{
    S.we ||= {}; S.we[blk.n] ||= {};
    S.we[blk.n].attempted = !S.we[blk.n].attempted;
    mark.classList.toggle("gold", S.we[blk.n].attempted);
    mark.textContent = S.we[blk.n].attempted ? "Attempted ✓" : "Mark as attempted";
    save();
  };
  sol.onclick = ()=>{
    const on = solImg.style.display !== "none";
    solImg.style.display = on ? "none" : "";
    sol.textContent = on ? "Show textbook solution" : "Hide textbook solution";
    S.we ||= {}; S.we[blk.n] ||= {}; S.we[blk.n].revealed = !on; save();
  };
  if (ta) ta.addEventListener("input", ()=>{
    S.we ||= {}; S.we[blk.n] ||= {};
    S.we[blk.n].text = ta.value; save();
  });
}

function renderTYU(card, k, blk){
  const st = S.tyu?.[blk.img] || {};
  const rating = st.rating || null;
  const padOpen = !!st.pad;
  card.innerHTML = `
    <h3>${blk.label} <span class="hint">· Cambridge — Test your understanding</span></h3>
    <div class="imgwrap"><img loading="lazy" src="img/${blk.img}.jpg"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <span class="tag ${rating==="got"?"got":rating==="review"?"rev":"open"}">${rating==="got"?"mastered":rating==="review"?"review later":"not rated"}</span>
      <button class="btn small tyugot">I've got it</button>
      <button class="btn ghost small tyurev">Review later</button>
      <button class="btn ghost small tyusketch">${padOpen?"✏ Hide sketch pad":"✏ Sketch your answer"}</button>
    </div>
    <div class="tyupad" ${padOpen?"":'style="display:none"'}></div>`;
  buildPad(card.querySelector(".tyupad"), {
    small: true,
    get: ()=> (S.tyu && S.tyu[blk.img] && S.tyu[blk.img].pad) || null,
    set: d => { S.tyu = S.tyu || {}; S.tyu[blk.img] = S.tyu[blk.img] || {rating:null};
                if (d) S.tyu[blk.img].pad = d; else delete S.tyu[blk.img].pad; }
  });
  card.querySelector(".tyusketch").onclick = ()=>{
    const pane = card.querySelector(".tyupad");
    const open = pane.style.display === "none";
    pane.style.display = open ? "" : "none";
    if (open) sizePads(card);
    card.querySelector(".tyusketch").textContent = open ? "✏ Hide sketch pad" : "✏ Sketch your answer";
  };
  card.querySelector(".tyugot").onclick = ()=>{ rateTYU(card, blk.img, "got"); };
  card.querySelector(".tyurev").onclick = ()=>{ rateTYU(card, blk.img, "review"); };
}
function rateTYU(card, img, val){
  S.tyu = S.tyu || {}; S.tyu[img] = S.tyu[img] || {};
  S.tyu[img].rating = val; save();
  const tag = card.querySelector(".tag");
  tag.className = "tag " + (val==="got"?"got":"rev");
  tag.textContent = val==="got"?"mastered":"review later";
}

function renderQuiz(card, k, blk){
  const qs = blk.questions;
  const saved = S.quiz?.[k] || new Array(qs.length).fill(null);
  card.innerHTML = `<b>Checkpoint quiz</b><p class="hint">Instant feedback. Answers are recorded — try to get every explanation.</p>
    <div id="qz"></div>
    <button class="btn ghost small" style="margin-top:8px">Reset this quiz</button>`;
  const qz = card.querySelector("#qz");
  function draw(){
    qz.innerHTML = qs.map((q,qi)=>`
      <div style="margin:14px 0">
        <div><b>Q${qi+1}.</b> ${q.q}</div>
        ${q.o.map((opt,oi)=>`<button class="qopt ${saved[qi]==null?"":(oi===q.a?"ok":oi===saved[qi]?"no":"")}" data-q="${qi}" data-o="${oi}">${"ABCD"[oi]||String.fromCharCode(65+oi)} · ${opt}</button>`).join("")}
        <div class="qexp ${saved[qi]!=null?"show":""}">${q.e}</div>
      </div>`).join("");
    qz.querySelectorAll(".qopt").forEach(btn=>{
      btn.onclick = ()=>{
        const qi = +btn.dataset.q, oi = +btn.dataset.o;
        saved[qi] = oi;
        S.quiz ||= {}; S.quiz[k] = saved; save();
        draw();
      };
    });
    const score = saved.filter((x,qi)=>x===qs[qi].a).length;
    const answered = saved.filter(x=>x!=null).length;
    qz.insertAdjacentHTML("beforeend",
      `<div style="margin-top:8px"><b>${score}/${qs.length}</b> <span class="hint">(${answered} answered)</span></div>`);
  }
  draw();
  card.querySelector("button").onclick = ()=>{
    saved.fill(null);
    S.quiz ||= {}; S.quiz[k] = saved; save(); draw();
  };
}

/* ---------- report ---------- */
function renderReport(){
  let rows = "", queue = [];
  MODULES.forEach((m,mi)=>{
    const st = moduleProgress(mi);
    const quizK = `m${mi}s${m.sections.length-1}b0`;
    const qBlk = m.sections[m.sections.length-1].blocks.find(b=>b.type==="quiz");
    let qScore = "—";
    if (qBlk){
      const arr = S.quiz?.[quizK]||[];
      const ans = arr.filter(x=>x!=null).length;
      qScore = `${arr.filter((x,i)=>x===qBlk.questions[i].a).length}/${qBlk.questions.length} (answered ${ans})`;
    }
    rows += `<tr><td><b>${m.part}</b> ${m.title}</td><td>${st.c}/${st.u} (${st.pct}%)</td><td>${qScore}</td></tr>`;
    m.sections.forEach((s,si)=>s.blocks.forEach((b,bi)=>{
      const k = bkey(mi,si,bi);
      if (b.type==="tyu" && S.tyu?.[b.img]?.rating==="review") queue.push([m.part, b.label]);
      if (b.type==="quiz"){
        const arr = S.quiz?.[k]||[];
        arr.forEach((x,i)=>{ if(x!=null && x!==b.questions[i].a) queue.push([m.part, `Quiz Q${i+1} — wrong`]); });
      }
      if (b.type==="fill"){
        const arr = S.fills?.[k];
        if (arr && !arr.every(Boolean)) queue.push([m.part, "Fill-in — not all correct"]);
      }
    }));
  });
  app.innerHTML = `
  <h1>My learning report</h1>
  <p class="hint">Summary of everything recorded in this browser. The review queue collects every practice item you marked "review later", every wrong quiz answer, and unfinished fill-ins.</p>
  <div class="card report">
    <table><tr><th>Module</th><th>Activities</th><th>Checkpoint quiz</th></tr>${rows}</table>
  </div>
  <h2>Review queue (${queue.length})</h2>
  ${queue.length? `<div class="card">${queue.map(([p,t])=>`<div>· <a href="#" onclick="route('${p}');return false;">Part ${p}</a> — ${t}</div>`).join("")}</div>` : `<p class="hint">Nothing queued — either you have not started, or you are on top of everything.</p>`}
  <button class="btn ghost small" onclick="resetAll()">Reset all progress</button>`;
}

buildTabs();
route("home");
</script>
